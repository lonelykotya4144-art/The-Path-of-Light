.candle{position:absolute;bottom:80px;left:8%;z-index:60;cursor:pointer}

@keyframes fk{to{transform:scale(1.1) skewX(2deg)}}
.cup{position:absolute;bottom:80px;right:10%;width:60px;height:45px;background:#2d1b0d;border-radius:0 0 20px 20px;z-index:60}
.cup{cursor:pointer;transform-origin:85% 90%;transition:transform .6s;z-index:250;width:68px;height:52px}.cup.tilt{transform:translate(-80px,-60px) rotate(-78deg)}.cup:before{content:'';position:absolute;top:0;left:3px;right:3px;height:9px;background:#4a2a14;border-radius:50%}.cup:after{content:"";position:absolute;right:-12px;top:10px;width:15px;height:20px;border:5px solid #2d1b0d;border-radius:50%}

.t-snake{--c2:#7fa389;--c1:#47694f}.t-joker{--c2:#d49a52;--c1:#9a6428}.t-thief{--c2:#a3a396;--c1:#6a6a60}.t-exec{--c2:#b08a6a;--c1:#6e4a30}

['spider','mask','vampire','comet','coin'].forEach(t=>['♠','♦'].forEach(s=>full.push({n:t,v:SP[t].v,s,t})));
['owl','eye','mage','wave','magnet'].forEach(t=>['♥','♣'].forEach(s=>full.push({n:t,v:SP[t].v,s,t})));
full.forEach(c=>{const r=Math.random();c.look=r<.4?'ok':r<.6?'torn'+(1+Math.floor(Math.random()*3)):r<.8?'crease':'hand'});
for(let i=full.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[full[i],full[j]]=[full[j],full[i]]}
const h=Math.floor(full.length/2);decks.p1=full.slice(0,h);decks.p2=full.slice(h);stats()}
function stats(){$('c1').innerText=decks.p1.length;$('c2').innerText=decks.p2.length;low=Math.min(low,decks.p1.length)}
function mk(c,p){const el=document.createElement('div');el.className='card lk-'+c.look+' '+(p==='p1'?'d1':'d2');const sp=c.t!=='normal',red=c.s==='♥'||c.s==='♦';
const lab=sp?SP[c.t].e:(LBL[c.n]||c.n);
el.innerHTML=`<div class="in"><div class="face back"></div><div class="face front ${sp?'sp t-'+c.t:(red?'red':'')}"><div class="rk">${lab}<i>${c.s}</i></div><div class="big">${sp?SP[c.t].e:c.s}</div>${sp?`<small>${SP[c.t].name}</small>`:''}<div class="rk b">${lab}<i>${c.s}</i></div></div></div>`;
$('game-field').appendChild(el);return el}
async function play(p){
if(over||table[p])return;
if(!decks[p].length){checkOver();return}
const c=decks[p].shift();c.own=p;const el=mk(c,p);el.style.zIndex=++z;stats();

await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));el.classList.add('flipped');sfx(300);
if(c.t==='snake'){pos(el,p==='p1'?'a1':'a2');aside.push({c,el});msg('ЗМЕЯ ЖДЁТ ЖЕРТВУ...');await sleep(350);return play(p)}
pos(el,p==='p1'?'t1':'t2');table[p]={c,el};el.classList.add('land');if(c.t!=='normal')setTimeout(()=>burstEl(el,FXC[c.t]),500);

async function turn(){if(lock||over)return;lock=true;if(isMuted&&!ac)toggleMute();await play('p1');await sleep(250);await play('p2')}
function steal(from,to,n,txt){let k=0;while(k<n&&decks[from].length){decks[to].push(decks[from].shift());k++}if(k){msg(txt);stats()}return k}
function fly(items,y){items.forEach(it=>{if(it.el.classList.contains('burn'))return;const d=y??(it.c.own==='p1'?1200:-1200);it.el.style.transform=`translate(-50%,${d}px) rotate(${Math.random()*30-15}deg)`;it.el.style.opacity=0})}
async function duel(){
busy=true;inc('rounds');await sleep(450);
let c1=table.p1.c,c2=table.p2.c;const has=t=>c1.t===t||c2.t===t;
if(aside.length){if(has('eagle')){msg('🦅 ОРЁЛ ВИДИТ ОБМАН!')}else{msg('ЗМЕИНЫЙ ОБМЕН!');inc('snake');await sleep(200);[table.p1,table.p2]=[table.p2,table.p1];pos(table.p1.el,'t1');pos(table.p2.el,'t2');c1=table.p1.c;c2=table.p2.c;await sleep(400)}}
let th=false;[table.p1,table.p2].forEach(x=>{if(x.c.t==='thief'){const o=x.c.own;if(steal(o==='p1'?'p2':'p1',o,1,'🗝️ ВОР УКРАЛ КАРТУ!')){inc('thief');th=true}}});[table.p1,table.p2].forEach(x=>{if(x.c.t==='coin'){x.c.v=Math.random()<.5?1:15;msg(x.c.v>1?'🪙 МОНЕТА: ОРЁЛ (15)':'🪙 МОНЕТА: РЕШКА (1)');inc('coin');th=true}});
[table.p1,table.p2].forEach(x=>{if(x.c.t==='judge'){const a=decks.p1.length,b=decks.p2.length;if(Math.abs(a-b)>=4){const big=a>b?'p1':'p2';steal(big,big==='p1'?'p2':'p1',Math.floor(Math.abs(a-b)/4)+1,'⚖️ СУДЬЯ УРАВНЯЛ КОЛОДЫ');inc('judge');th=true}}
if(x.c.t==='storm'){[decks.p1,decks.p2].forEach(d=>{for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}});msg('🌪️ БУРЯ! КОЛОДЫ ПЕРЕТАСОВАНЫ');inc('storm');lightning();th=true}});
[table.p1,table.p2].forEach(x=>{const t=x.c.t,o=x.c.own;
if(t==='owl'){inc('owl');const e=decks[o==='p1'?'p2':'p1'].slice(0,2).map(c=>c.t==='normal'?(LBL[c.n]||c.n)+c.s:SP[c.t].e).join('  ');msg(o==='p1'?'🦉 СОВА ВИДИТ: '+(e||'пусто'):'🦉 Сова врага следит за тобой');th=true}
if(t==='mage'){const a=decks.p1.splice(0,2),b=decks.p2.splice(0,2);decks.p1.unshift(...b);decks.p2.unshift(...a);msg('🧙 МАГ ПОМЕНЯЛ ВЕРХНИЕ КАРТЫ');inc('mage');stats();th=true}
if(t==='wave'&&pot.length){pot.forEach(it=>decks[it.c.own].push(it.c));fly(pot);const g=pot;pot=[];setTimeout(()=>g.forEach(i=>i.el.remove()),600);msg('🌊 ВОЛНА СМЫЛА БАНК');inc('wave');stats();th=true}});
if(th)await sleep(700);
const isN=(x,n)=>x.t==='normal'&&x.n===n,pair=(f,g)=>(f(c1)&&g(c2))?'p1':(f(c2)&&g(c1))?'p2':null;
const bf=buff.p1;buff.p1=0;let w=null,kind='',r;
if(has('bomb')){kind='burn';msg('💣 ВЗРЫВ! ОБЕ КАРТЫ СГОРЕЛИ');inc('bomb')}
else if(has('mirror')){kind='tie';msg('🪞 ЗЕРКАЛО: СПОР!');inc('mirror')}
else if(has('joker')&&has('musician')){kind='return';msg('БЕЗУМИЕ И МУЗЫКА: НИЧЬЯ')}
else if(r=pair(x=>x.t==='joker',x=>isN(x,'T'))){w=r;msg('ДЖОКЕР ХИТРЕЕ ТУЗА');inc('jokerAce')}
else if(r=pair(x=>x.t==='eagle',x=>x.t==='joker')){w=r;msg('🦅 ОРЁЛ КЛЮЁТ ДЖОКЕРА')}
else if(r=pair(x=>x.t==='musician',x=>x.t==='queen')){w=r;msg('МУЗЫКА ПОКОРИЛА КОРОЛЕВУ');inc('music')}
else if(r=pair(x=>isN(x,'B'),x=>x.t==='dragon')){w=r;msg('УБИЙЦА ДРАКОНОВ!');inc('dragon');shake()}
else if(r=pair(x=>x.t==='exec',x=>x.t==='queen'||isN(x,'K')||isN(x,'D'))){w=r;msg('🪓 ПАЛАЧ КАЗНИЛ ЗНАТЬ');inc('exec')}
else{const rev=(c1.t==='witch')!==(c2.t==='witch');const V=(x,y)=>(x.t==='wolf'?5+pot.length:x.t==='mask'?lastV:x.v)-(y.t==='spider'?3:y.t==='eye'?5:0)+(x.own==='p1'?bf:0);if(V(c1,c2)!==V(c2,c1)){w=((V(c1,c2)>V(c2,c1))!==rev)?'p1':'p2';if(rev)msg('🌙 ВЕДЬМА ПЕРЕВЕРНУЛА ПРАВИЛА!')}}
if(w&&!kind&&table[w==='p1'?'p2':'p1'].c.t==='shield'){w=null;kind='tie';msg('🛡️ ЩИТ УСТОЯЛ: СПОР!');inc('shield')}
let items,keep=false;
if(kind==='burn'){items=[table.p1,table.p2];shake();flash('#ff7b00');items.forEach(it=>burn(it.el));
aside.forEach(it=>decks[it.c.own].push(it.c));fly(aside);items=[...items,...aside];keep=true}
else if(kind==='return'){items=[...pot,table.p1,table.p2,...aside];items.forEach(it=>decks[it.c.own].push(it.c));fly(items)}
else if(w){const L=w==='p1'?'p2':'p1';items=[...pot,table.p1,table.p2,...aside];const fc=FXC[table[w].c.t]||'#fbbf24';burstEl(table[w].el,fc);flash(fc);sfx(660,.3);
items.forEach(it=>{const back=it===table[L]&&it.c.t==='phoenix';if(it.c.t==='comet'&&it===table[w]){burn(it.el);msg('☄️ КОМЕТА СГОРЕЛА В ПЛАМЕНИ');inc('comet');return}decks[back?it.c.own:w].push(it.c);if(back){msg('🔥 ФЕНИКС ВОЗРОЖДАЕТСЯ!');inc('phoenix')}});
fly(items,w==='p1'?1200:-1200);const wc=table[w].c;
if(wc.t==='eagle'){inc('eagle');if(steal(L,w,1,'🦅 ОРЁЛ УНЁС ДОБЫЧУ'))inc('loot')}
if(wc.t==='witch')inc('witch');if(wc.t==='wolf')inc('wolf');if(wc.t==='spider')inc('spider');if(wc.t==='mask')inc('mask');if(wc.t==='vampire'&&steal(L,w,1,'🧛 ВАМПИР ВЫПИЛ КАРТУ'))inc('vampire');lastV=wc.t==='mask'?lastV:wc.v;if(wc.t==='eye')inc('eye');if(wc.t==='magnet'){let k=0;for(let i=decks[L].length-1;i>=0&&k<2;i--){if(decks[L][i].s===wc.s){decks[w].push(decks[L].splice(i,1)[0]);k++}}if(k){msg('🧲 МАГНИТ ПРИТЯНУЛ КАРТЫ');inc('magnet')}}if(table[L].c.t==='poison'&&steal(w,L,1,'🧪 ЯД! ПОБЕДИТЕЛЬ ОТДАЁТ КАРТУ'))inc('poison');
if(has('treasure')&&steal(L,w,2,'💎 СОКРОВИЩЕ! +2 КАРТЫ'))inc('treasure')}
else{if(kind!=='tie')msg('СПОР!');inc('wars');pot.push(table.p1,table.p2,...aside);mx('pot',pot.length);items=null}
if(items){await sleep(kind==='burn'||items.some(i=>i.el.classList.contains('burn'))?1700:450);items.forEach(it=>it.el.remove());if(!keep)pot=[]}
table={p1:null,p2:null};aside=[];busy=false;lock=false;if(!pot.length)z=20;stats();
if(checkOver())return;
if(auto)turn()}
function checkOver(){const a=decks.p1.length,b=decks.p2.length;if(a&&b)return false;end(!a&&!b?null:(a?'p1':'p2'));return true}
function end(w){if(over)return;over=true;inc('games');
if(w==='p1'){inc('wins');if(low<=8)inc('comeback');msg('ТЫ — МАСТЕР КАРТ!',1);for(let i=0;i<8;i++)setTimeout(()=>burst(innerWidth*Math.random(),innerHeight*.5*Math.random()+60,['#fbbf24','#f87171','#4ade80','#60a5fa'][i%4]),i*200)}
else if(w==='p2'){inc('losses');msg('ТАВЕРНА ЗАБРАЛА ВСЁ...',1)}else msg('НИЧЬЯ — ВСЁ СГОРЕЛО',1);
setTimeout(()=>$('again').style.display='block',1500)}
const FXC={dragon:'#ff5a2a',eagle:'#7dd3fc',exec:'#b91c1c',mirror:'#e2e8f0',phoenix:'#ffb703',witch:'#a78bfa',treasure:'#fde047',bomb:'#ff7b00',thief:'#9ca3af',joker:'#fb8500',musician:'#ff9ec0',snake:'#52b788',queen:'#c77dff'};
function flash(c){const d=document.createElement('div');d.className='flash';d.style.background=`radial-gradient(circle,${c}aa,transparent 70%)`;document.body.appendChild(d);setTimeout(()=>d.remove(),500)}
function embers(x,y){for(let i=0;i<6;i++){const s=document.createElement('div');s.className='spark';const c=['#ff7b00','#ffb703','#ff4d00'][i%3];s.style.cssText=`left:${x+Math.random()*60-30}px;top:${y}px;width:5px;height:5px;background:${c};box-shadow:0 0 8px ${c};--dx:${Math.random()*50-25}px;--dy:${-60-Math.random()*90}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function burn(el){el.classList.add('burn');const f=document.createElement('div');f.className='flm';el.appendChild(f);const r=el.getBoundingClientRect();let n=0;const iv=setInterval(()=>{embers(r.left+r.width/2,r.bottom-25);if(++n>9)clearInterval(iv)},130);sfx(110,.6);setTimeout(()=>el.remove(),1600)}
document.body.insertAdjacentHTML('beforeend','<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence baseFrequency=".05" numOctaves="2"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></svg>');
(function(){const b=document.body,mk=(h,c)=>{const d=document.createElement('div');d.className=c;d.style.cssText=h;b.appendChild(d);return d};
[['🍞','3%','70%',34,-20,'bread'],['🧀','88%','47%',30,15,'cheese'],['🍖','4%','40%',32,25,'meat'],['🍎','84%','82%',26,0,'apple'],['♞','27%','6%',34,-10],['♟','70%','8%',30,10],['🎲','60%','90%',26,30,'dice'],['🗡️','30%','92%',30,70,'dagger'],['🀄','90%','33%',28,-12],['🗝️','10%','56%',26,40,'key']].forEach(a=>{const d=mk(`left:${a[1]};top:${a[2]};font-size:${a[3]}px;transform:rotate(${a[4]}deg)`,'it');d.textContent=a[0];if(a[5]){d.classList.add('act');d.onclick=()=>act(a[5],d)}});
[['left:15%;top:22%','#9b2226'],['left:16.4%;top:23.2%','#1b4332'],['right:20%;top:70%','#1d3557']].forEach(a=>mk(a[0]+';background:'+a[1],'chip'));
mk('','dark')})();
function thunder(){if(isMuted||!ac)return;const n=ac.sampleRate*2.5,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=180;const g=ac.createGain();g.gain.value=1.4;s.connect(f);f.connect(g);g.connect(ac.destination);s.start()}
function lightning(){const d=document.createElement('div');d.className='ltn';document.body.appendChild(d);setTimeout(()=>d.remove(),900);setTimeout(thunder,500+Math.random()*1500)}
function drip(){const x=innerWidth*(.15+Math.random()*.7),y=innerHeight*(.25+Math.random()*.5),d=document.createElement('div');d.className='drop';d.style.left=x+'px';d.style.setProperty('--y',y+'px');document.body.appendChild(d);setTimeout(()=>{d.remove();const r=document.createElement('div');r.className='ripple';r.style.cssText=`left:${x}px;top:${y}px`;document.body.appendChild(r);sfx(1500,.06);setTimeout(()=>r.remove(),1200)},700)}
(function l(){setTimeout(()=>{lightning();l()},3000+Math.random()*5000)})();
const buff={p1:0},used={};
function act(k,el){
if(over)return;const dk=k==='dice',cnt=used[k]||0;
if((!dk&&cnt)||(dk&&cnt>=3)){msg('Уже использовано');return}
if(k!=='meat'&&(busy||lock)){msg('Подожди, пока закончится ход');return}
used[k]=cnt+1;if(!dk||used[k]>=3)el.classList.add('used');sfx(240,.1);
if(k==='bread'){inc('food');if(decks.p2.length-decks.p1.length>=5)steal('p2','p1',1,'🍞 Подкрепился: +1 карта');else msg('🍞 Вкусно, но ты не голоден')}
else if(k==='meat'){inc('food');buff.p1=2;msg('🍖 Сытость: следующая карта сильнее на 2')}
else if(k==='cheese'){inc('food');msg('🧀 Пахнет сыром...');const m=document.createElement('div');m.className='mouse';m.textContent='🐭';document.body.appendChild(m);setTimeout(()=>{if(steal('p2','p1',1,'🐭 Мышь утащила карту врага'))inc('mouse');stats()},900);setTimeout(()=>m.remove(),1900)}
else if(k==='apple'){inc('food');const d=decks.p1;for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}msg('🍎 Яблоко съедено: колода перемешана')}
else if(k==='dagger'){if(!decks.p2.length)return;inc('dagger');const c=decks.p2.shift(),e=mk(c,'p2');e.style.zIndex=++z;requestAnimationFrame(()=>requestAnimationFrame(()=>{e.classList.add('flipped');pos(e,'t2')}));setTimeout(()=>burn(e),500);msg('🗡️ Кинжал! Карта врага сгорела')}
else if(k==='key'){if(Math.random()<.6)steal('p2','p1',2,'🗝️ Сундук: +2 карты');else steal('p1','p2',1,'🗝️ Ловушка в сундуке: −1 карта')}
else if(k==='dice'){inc('dice');const r=1+Math.floor(Math.random()*6);if(r===6)steal('p2','p1',2,'🎲 Шесть! +2 карты');else if(r===1)steal('p1','p2',1,'🎲 Единица... −1 карта');else msg('🎲 Выпало '+r)}
stats();checkOver()}
let sips=3;
$('cup').onclick=function(){const e=this;if(e.dataset.b)return;e.dataset.b=1;e.classList.add('tilt');sfx(180,.4);setTimeout(()=>sfx(140,.3),300);
document.body.classList.add('drunk');setTimeout(()=>document.body.classList.remove('drunk'),3500);inc('sip');
{const r=e.getBoundingClientRect();for(let i=0;i<4;i++)setTimeout(()=>burst(r.left,r.top+25,'#6b3b1a'),200+i*220);const p=document.createElement('div');p.className='puddle';p.style.cssText=`left:${r.left-50}px;top:${r.top+70}px`;document.body.appendChild(p);setTimeout(()=>p.remove(),25000)}
if(sips>0&&!over&&decks.p2.length){sips--;const c=decks.p2[0];msg(`🍺 Глоток... Враг достанет: ${c.t==='normal'?(LBL[c.n]||c.n)+c.s:SP[c.t].e+' '+SP[c.t].name} (глотков: ${sips})`)}else msg('🍺 Кружка пуста...');

$('go').onclick=turn;

init();
