for(const q of r){const g=x.createLinearGradient(0,q.y,0,q.y+130);g.addColorStop(0,q.d?'#9fe3c4':'#2a2f55');g.addColorStop(1,q.d?'#6fcf9f':'#0e1230');x.fillStyle=g;x.beginPath();x.roundRect(q.c*90+3,q.y+3,84,124,10);x.fill()}
if(st)veil(x,360,520,L('Мимо!','Missed!'),L('Нажми, чтобы сыграть ещё','Click to play again'))})}

function hanoi(){let p=[[4,3,2,1],[],[]],s=-1,mv=0;
$('#stage').innerHTML=`<p class="info">${L('Перенеси все диски на правый стержень. Большой диск нельзя класть на меньший.','Move all discs to the right peg. Never place a big disc on a smaller one.')}</p><div class="hud" id="hud"></div><div class="hn" id="hn"></div>`;
const dr=()=>{$('#hn').innerHTML=p.map((q,i)=>`<div class="pg${s===i?' sel':''}" data-p="${i}">${q.map(d=>`<i data-k="${d}" style="width:${40+d*28}px;--h:${d*60}"></i>`).join('')}</div>`).join('');hud(p[2].length===4?L('Победа за ','Solved in ')+mv+L(' ходов! Рекорд: ',' moves! Best: ')+best('hanoi',mv,1):L('Ходов: ','Moves: ')+mv)};
$('#hn').onclick=e=>{const g=e.target.closest('[data-p]');if(!g||p[2].length===4)return;const i=+g.dataset.p;if(s<0){if(p[i].length)s=i;dr();return}const a=p[s],b=p[i];if(i!==s&&(!b.length||a[a.length-1]<b[b.length-1])){flip($('#hn'),()=>{b.push(a.pop());mv++;s=-1;dr()});return}s=-1;dr()};dr()}

function rush(){const n=16;let k=1,t0=0;$('#stage').innerHTML=`<p class="info">${L('Нажимай числа от 1 до 16 по порядку — как можно быстрее.','Tap the numbers 1 to 16 in order as fast as you can.')}</p><div class="hud" id="hud"></div><div class="rush" id="rg"></div>`;
hud(L('Рекорд: ','Best: ')+(best('rush')?best('rush')/100+' s':'—'));
[...Array(n)].map((_,i)=>i+1).sort(()=>Math.random()-.5).forEach(v=>{const b=document.createElement('button');b.className='rb';b.textContent=v;b.onclick=()=>{if(v!==k)return;if(k===1)t0=performance.now();b.classList.add('ok');if(k===n){const t=Math.round((performance.now()-t0)/10);hud(L('Готово! ','Done! ')+t/100+' s · '+L('Рекорд: ','Best: ')+best('rush',t,1)/100+' s')}k++};$('#rg').appendChild(b)})}
